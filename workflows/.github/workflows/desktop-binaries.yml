name: android-apk

# Builds the APK from source on a release tag. Two things this deliberately does
# NOT do:
#   1. commit a prebuilt binary - rebuildability is the point of open source, and
#      a committed .apk is also a supply-chain risk nobody in the repo can audit;
#   2. pretend a debug build is store-quality. app-debug.apk is debuggable and
#      signed with the Android debug key, so Play Protect warns "app isn't
#      verified" on install. Fine for sideloading and for your own parents; not
#      what goes to Google Play. Play needs assembleRelease + your upload key + .aab.
on:
  push: { tags: ["v*"] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: gradle wrapper (committed once by you; CI regenerates if absent)
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
      - name: unit tests (core runs on plain JVM, no emulator)
        run: gradle :core:test :app:testDebugUnitTest --no-daemon --stacktrace
      - name: debug APK (sideload)
        run: gradle :app:assembleDebug --no-daemon
      - name: release AAB (Play artifact; unsigned in public CI)
        run: gradle :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sceneguard-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sceneguard-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
