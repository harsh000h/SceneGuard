name: desktop-binaries

# Windows .exe / macOS .app / Linux binary for the LOCAL-FILE app (PyInstaller).
# Scope note, because it is the question every user asks first: this is NOT
# "SceneGuard for Netflix". Streaming-site filtering stays in the Chrome
# extension, because a standalone desktop app would have to re-host the site to
# reach its player - the one thing we never do.

on:
  push: { tags: ["v*"] }
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: sceneguard-desktop-windows
          - os: macos-latest
            out: sceneguard-desktop-macos
          - os: ubuntu-latest
            out: sceneguard-desktop-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy opencv-python-headless pyinstaller
      - name: tests gate the binary
        run: python -m sceneguard selftest && python desktop/app.py selftest
      - name: bundle
        run: pyinstaller --onefile --name sceneguard-desktop --collect-all sceneguard --hidden-import cv2 desktop/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/sceneguard-desktop*
