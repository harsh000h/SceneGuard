[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneguard"
version = "0.1.0"
description = "Scene-level skip/blur of adult content for DRM-free video. Never touches streams."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.9"]

[project.scripts]
sceneguard = "sceneguard.__main__:main"

[project.urls]
Repository = "https://github.com/REPLACE_ME/sceneguard"

[tool.setuptools]
packages = ["sceneguard"]
