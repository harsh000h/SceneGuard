name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy opencv-python-headless
      - name: pipeline + scope invariant
        run: python -m sceneguard selftest
      - name: desktop renderer (headless)
        run: python desktop/app.py selftest

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: JS core vs the Python-generated golden manifest
        run: node extension/test-core.mjs

  # Fails loudly if someone edits one core and not the others - the real risk in
  # a three-surface project. Bare JVM: no Android SDK, no emulator, no Gradle.
  kotlin-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: bash scripts/verify-kotlin.sh
