name: android-apk

# Builds the APK from source on a release tag. Two things this deliberately does
# NOT do:
#   1. commit a prebuilt binary - rebuildability is the point of open source, and
#      a committed .apk is also a supply-chain risk nobody in the repo can audit;
#   2. pretend a debug build is store-quality. app-debug.apk is debuggable and
#      signed with the Android debug key, so Play Protect warns "app isn't
#      verified" on install. Fine for sideloading and for your own parents; not
#      what goes to Google Play. Play needs assembleRelease + your upload key + .aab.
#
# The Android SDK is NOT preinstalled on a fresh runner, and `local.properties` is
# gitignored (correctly - it hardcodes a machine path). Both are set up here; the
# first tag build failed because neither was, and Gradle died at configuration time
# before compiling a single file.
on:
  push: { tags: ["v*"] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: android } }
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - uses: android-actions/setup-android@v3
      - name: point the build at the runner's SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: gradle wrapper (committed once by you; CI regenerates if absent)
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
      # :core alone, deliberately. It is pure JVM Kotlin, so this step needs no
      # emulator and no Android SDK, and it still enforces the cross-core scope
      # invariant against the Python-generated golden manifest.
      - name: unit tests (core runs on plain JVM, no emulator)
        run: gradle :core:test --no-daemon --stacktrace
      # A suite that runs zero tests reports success, which is a lie worth failing
      # the build over - the same class of bug as an empty assertion list.
      - name: assert the core suite actually ran
        run: |
          set -euo pipefail
          xml=$(find core/build/test-results/test -name 'TEST-*.xml' -print -quit)
          [ -n "$xml" ] || { echo "no JUnit XML produced"; exit 1; }
          n=$(sed -n 's/.*<testsuite[^>]*tests="\([0-9]*\)".*/\1/p' "$xml" | head -1)
          echo "core tests executed: $n"
          [ "${n:-0}" -ge 8 ] || { echo "expected >=8 core tests, got $n"; exit 1; }
      - name: debug APK (sideload)
        run: gradle :app:assembleDebug --no-daemon
      - name: release AAB (Play artifact; unsigned in public CI)
        run: gradle :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sceneguard-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sceneguard-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
